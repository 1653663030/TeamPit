name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements-build.txt

      - name: 打包成 EXE
        run: |
          pyinstaller --onefile --add-data "static;static" --name TeamPit main.py

      - name: 上传 EXE
        uses: actions/upload-artifact@v6
        with:
          name: TeamPit-Windows
          path: dist/TeamPit.exe

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/TeamPit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
