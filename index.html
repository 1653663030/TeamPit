<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamPit - 团队作战指挥室</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="app" class="container-fluid p-0">

    <!-- ============================================================ -->
    <!-- 页面1: 入口页 (创建/加入房间) -->
    <!-- ============================================================ -->
    <div id="page-entry" class="page">
        <div class="row min-vh-100 align-items-center justify-content-center bg-light">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h1 class="display-4 fw-bold text-primary">🏆 TeamPit</h1>
                            <p class="text-muted">团队作战指挥室 · 极简协作</p>
                        </div>

                        <!-- Tab 切换 -->
                        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-create" type="button">
                                    <i class="fas fa-plus-circle me-1"></i> 创建房间
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-join" type="button">
                                    <i class="fas fa-sign-in-alt me-1"></i> 加入房间
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <!-- 创建房间 Tab -->
                            <div class="tab-pane fade show active" id="tab-create">
                                <form id="form-create">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">房间号</label>
                                        <input type="text" id="create-room-id" class="form-control" placeholder="如: gdg-hack-2026" required />
                                        <div class="form-text">建议使用英文+数字，方便队友输入</div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">你的 ID（房主）</label>
                                        <input type="text" id="create-owner-id" class="form-control" placeholder="如: captain_li" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">成员白名单</label>
                                        <textarea id="create-whitelist" class="form-control" rows="4" placeholder="一行一个ID，如：&#10;captain_li&#10;zhang_wei&#10;li_na&#10;wang_fei" required></textarea>
                                        <div class="form-text">把允许进入的队友ID都填上，一行一个</div>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100 py-2">
                                        <i class="fas fa-rocket me-2"></i> 创建作战室
                                    </button>
                                </form>
                            </div>

                            <!-- 加入房间 Tab -->
                            <div class="tab-pane fade" id="tab-join">
                                <form id="form-join">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">房间号</label>
                                        <input type="text" id="join-room-id" class="form-control" placeholder="房主告诉你的房间号" required />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">你的 ID</label>
                                        <input type="text" id="join-user-id" class="form-control" placeholder="房主给你分配的ID" required />
                                    </div>
                                    <button type="submit" class="btn btn-success w-100 py-2">
                                        <i class="fas fa-door-open me-2"></i> 进入作战室
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- 错误提示 -->
                        <div id="entry-error" class="alert alert-danger mt-3 d-none"></div>
                    </div>
                </div>
                <div class="text-center mt-3 text-muted small">
                    <i class="fas fa-lock me-1"></i> 白名单保护 · 数据本地存储
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 页面2: 主面板 (任务板/灵感墙/文件仓/站会) -->
    <!-- ============================================================ -->
    <div id="page-dashboard" class="page d-none">
        <!-- 顶部导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="fas fa-flag-checkered me-2"></i>TeamPit
                </a>
                <span class="navbar-text text-light d-none d-md-inline">
                    <i class="fas fa-hashtag me-1"></i> <span id="dash-room-id">---</span>
                </span>
                <span class="navbar-text text-light mx-3">
                    <i class="fas fa-user me-1"></i> <span id="dash-user-id">---</span>
                </span>
                <button class="btn btn-outline-light btn-sm ms-auto" id="btn-leave">
                    <i class="fas fa-sign-out-alt me-1"></i> 退出
                </button>
            </div>
        </nav>

        <!-- 功能 Tab 切换 -->
        <ul class="nav nav-tabs nav-fill bg-light border-bottom" id="dash-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-tasks" type="button">
                    <i class="fas fa-tasks me-1"></i> 任务板
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-ideas" type="button">
                    <i class="fas fa-lightbulb me-1"></i> 灵感墙
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-files" type="button">
                    <i class="fas fa-folder-open me-1"></i> 文件仓
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-checkin" type="button">
                    <i class="fas fa-clipboard-check me-1"></i> 每日站会
                </button>
            </li>
        </ul>

        <!-- Tab 内容 -->
        <div class="tab-content p-3">

            <!-- ========== 任务板 ========== -->
            <div class="tab-pane fade show active" id="tab-tasks">
                <div class="row mb-3">
                    <div class="col">
                        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal-task">
                            <i class="fas fa-plus me-1"></i> 新建任务
                        </button>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="card bg-light border-0">
                            <div class="card-header bg-secondary text-white fw-bold">📋 待办</div>
                            <div class="card-body task-list" data-status="todo"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light border-0">
                            <div class="card-header bg-warning text-dark fw-bold">⚡ 进行中</div>
                            <div class="card-body task-list" data-status="doing"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-light border-0">
                            <div class="card-header bg-success text-white fw-bold">✅ 已完成</div>
                            <div class="card-body task-list" data-status="done"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== 灵感墙 ========== -->
            <div class="tab-pane fade" id="tab-ideas">
                <div class="row mb-3">
                    <div class="col">
                        <form id="form-idea" class="d-flex gap-2">
                            <input type="text" id="idea-content" class="form-control" placeholder="随手扔个想法..." required />
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="fas fa-paper-plane me-1"></i> 发布
                            </button>
                        </form>
                    </div>
                </div>
                <div id="idea-list" class="list-group"></div>
            </div>

            <!-- ========== 文件仓 ========== -->
            <div class="tab-pane fade" id="tab-files">
                <div class="row mb-3">
                    <div class="col">
                        <form id="form-file" class="d-flex gap-2 flex-wrap">
                            <input type="file" id="file-input" class="form-control form-control-sm" style="width:auto;" required />
                            <input type="text" id="file-tags" class="form-control form-control-sm" placeholder="标签 (如: 设计稿)" style="width:150px;" />
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="fas fa-upload me-1"></i> 上传
                            </button>
                        </form>
                    </div>
                </div>
                <div id="file-list" class="row g-3"></div>
            </div>

            <!-- ========== 每日站会（所有字段选填） ========== -->
            <div class="tab-pane fade" id="tab-checkin">
                <div class="row mb-3">
                    <div class="col">
                        <div class="card border-0 bg-light">
                            <div class="card-body">
                                <h6 class="card-title fw-bold"><i class="fas fa-pen me-2"></i>今日签到</h6>
                                <form id="form-checkin">
                                    <div class="mb-2">
                                        <label class="form-label small">昨天做了什么？</label>
                                        <input type="text" id="checkin-yesterday" class="form-control form-control-sm" placeholder="（选填）" />
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label small">今天要做什么？</label>
                                        <input type="text" id="checkin-today" class="form-control form-control-sm" placeholder="（选填）" />
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label small">遇到的阻碍？</label>
                                        <input type="text" id="checkin-blocked" class="form-control form-control-sm" placeholder="（选填）" />
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-sm">
                                        <i class="fas fa-check me-1"></i> 签到
                                    </button>
                                    <span id="checkin-status" class="ms-2 text-muted small"></span>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="checkin-list" class="row g-3"></div>
            </div>

        </div>
    </div>

    <!-- ============================================================ -->
    <!-- 模态框: 新建/编辑任务 -->
    <!-- ============================================================ -->
    <div class="modal fade" id="modal-task" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title">新建任务</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-task">
                        <div class="mb-2">
                            <label class="form-label small">任务标题</label>
                            <input type="text" id="task-title" class="form-control form-control-sm" required />
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">负责人 (输入ID)</label>
                            <input type="text" id="task-assignee" class="form-control form-control-sm" placeholder="如: zhang_wei" />
                        </div>
                        <input type="hidden" id="task-edit-id" value="" />
                        <button type="submit" class="btn btn-primary btn-sm w-100">保存</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- ==================== JavaScript ==================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>

</body>
</html>
